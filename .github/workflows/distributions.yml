name: Distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      PERM_BUILD_OPENMP: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine pytest 'setuptools>=77'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_distribution.py dist --require-portable
      - name: Test public source archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m pip install 'numpy>=1.23.5,<3'
          python tools/extract_sdist.py dist/*.tar.gz public-tests
          cd public-tests/rivin_perm-*
          python -m pytest -q
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: portable-dist
          path: dist/*

  fallback-and-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - name: A broken compiler must still produce a portable fallback wheel
        env:
          CC: /definitely-missing-compiler
          PERM_BUILD_OPENMP: auto
        run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_distribution.py dist --require-portable --numpy-version 1.23.5
      - run: python tools/check_distribution.py dist --require-portable --require-numba
      - name: A required native build must reject that compiler
        env:
          CC: /definitely-missing-compiler
          PERM_BUILD_OPENMP: required
        shell: bash
        run: |
          if python -m build --wheel --outdir rejected-wheel; then
            echo 'Required native build unexpectedly succeeded'
            exit 1
          fi

  linux-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install cibuildwheel==4.3.5
      - run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: linux-native-wheels
          path: wheelhouse/*.whl

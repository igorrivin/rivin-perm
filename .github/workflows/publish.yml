name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Distributions workflow run ID
        required: true
        type: string
      commit:
        description: Exact 40-character commit tested by that run
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install twine
      - name: Verify CI and collect immutable tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: python tools/prepare_release.py --run-id "$RELEASE_RUN_ID" --commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-release-manifest
          path: release-manifest.json
      - name: Publish the tested distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: release-dist/
